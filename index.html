<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Crawler: Tactical Siege</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #canvas {
            flex: 1;
            display: block;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            image-rendering: pixelated;
        }

        /* UI Overlay */
        #uiContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Minimap */
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            border: 3px solid #00ff00;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            border-radius: 4px;
        }

        /* Health/Ammo Bar */
        #playerStats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 2px solid #ff3333;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        }

        .statBar {
            margin-bottom: 10px;
        }

        .statLabel {
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .barBg {
            width: 100%;
            height: 20px;
            background: rgba(50, 50, 50, 0.8);
            border: 1px solid #666;
            position: relative;
            overflow: hidden;
        }

        .barFill {
            height: 100%;
            transition: width 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 5px;
            font-size: 10px;
            font-weight: bold;
        }

        .healthBar .barFill {
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff3333);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        .ammoBar .barFill {
            background: linear-gradient(90deg, #ffff00, #ff9900);
            box-shadow: 0 0 10px rgba(255, 200, 0, 0.8);
        }

        /* Team List */
        #teamList {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ccff;
            border-radius: 4px;
            padding: 10px;
            min-width: 200px;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.5);
        }

        .teamMember {
            padding: 8px;
            margin: 5px 0;
            background: rgba(0, 100, 150, 0.4);
            border-left: 3px solid #00ff00;
            font-size: 12px;
            border-radius: 2px;
        }

        .teamMember.dead {
            border-left-color: #ff3333;
            opacity: 0.5;
            text-decoration: line-through;
        }

        /* Ability Cooldowns */
        #abilityBar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .abilityIcon {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffaa00;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.6);
            pointer-events: all;
            transition: all 0.2s;
        }

        .abilityIcon:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 170, 0, 1);
        }

        .abilityIcon.active {
            background: rgba(0, 200, 100, 0.8);
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        .cooldown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none;
            display: none;
        }

        .crosshair-line {
            position: absolute;
            background: #00ff00;
            box-shadow: 0 0 5px #00ff00;
        }

        .crosshair-h {
            width: 10px;
            height: 2px;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
        }

        .crosshair-v {
            width: 2px;
            height: 10px;
            left: 50%;
            top: 10px;
            transform: translateX(-50%);
        }

        /* Damage Numbers */
        .damageNumber {
            position: absolute;
            color: #ff3333;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 5px #ff0000;
            pointer-events: none;
            z-index: 100;
        }

        /* Kill Feed */
        #killFeed {
            position: absolute;
            top: 20px;
            right: 240px;
            font-size: 12px;
            max-width: 300px;
        }

        .killFeedItem {
            background: rgba(0, 0, 0, 0.8);
            border-left: 3px solid #ff3333;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 2px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Scoreboard */
        #scoreboard {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffaa00;
            border-radius: 8px;
            padding: 30px;
            min-width: 500px;
            z-index: 1000;
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.8);
        }

        .scoreboard-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .scoreboard-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }

        /* Tactical Grid */
        #tacticalGrid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            pointer-events: none;
        }

        /* Damage Indicator */
        #damageIndicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255, 0, 0, 0);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        /* Wave/Round Info */
        #waveInfo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 20px #00ff00;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        <div id="uiContainer">
            <canvas id="tacticalGrid"></canvas>
            <div id="minimap"></div>
            <div id="teamList">
                <div style="text-align: center; margin-bottom: 10px; color: #00ccff; font-weight: bold;">TEAM ALPHA</div>
            </div>
            <div id="killFeed"></div>
            <div id="playerStats">
                <div class="statBar healthBar">
                    <div class="statLabel">❤ Health</div>
                    <div class="barBg">
                        <div class="barFill" id="healthFill" style="width: 100%">100/100</div>
                    </div>
                </div>
                <div class="statBar ammoBar">
                    <div class="statLabel">⚔ Ammo</div>
                    <div class="barBg">
                        <div class="barFill" id="ammoFill" style="width: 100%">30/30</div>
                    </div>
                </div>
                <div style="font-size: 11px; margin-top: 10px; color: #999;">
                    <div>Wave: <span id="waveNum">1</span></div>
                    <div>Gold: <span id="goldNum">0</span></div>
                </div>
            </div>
            <div id="abilityBar">
                <div class="abilityIcon" data-ability="dash" title="Dash (Q)">
                    <span>⚡</span>
                    <div class="cooldown" style="display:none;"></div>
                </div>
                <div class="abilityIcon" data-ability="ability2" title="Ability 2 (E)">
                    <span>🔥</span>
                    <div class="cooldown" style="display:none;"></div>
                </div>
                <div class="abilityIcon" data-ability="ability3" title="Ability 3 (R)">
                    <span>❄️</span>
                    <div class="cooldown" style="display:none;"></div>
                </div>
                <div class="abilityIcon" data-ability="ult" title="Ultimate (X)">
                    <span>⭐</span>
                    <div class="cooldown" style="display:none;"></div>
                </div>
            </div>
            <div id="waveInfo"></div>
            <div id="damageIndicator"></div>
            <div id="scoreboard">
                <div class="scoreboard-title">Round Complete</div>
                <div id="scoreboardContent"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
